  <rect x="130" y="174" width="26" height="22" stroke="#3A724F" stroke-width="5"/>
  <!-- door -->
  <rect x="194" y="174" width="26" height="44" stroke="#C85D1B" stroke-width="6"/>
  <!-- side wing -->
  <path d="M240 150 H296 V218" stroke="#3A724F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 150 H304" stroke="#14424C" stroke-width="6" stroke-linecap="round"/>
  <rect x="256" y="168" width="22" height="20" stroke="#3A724F" stroke-width="5"/>
